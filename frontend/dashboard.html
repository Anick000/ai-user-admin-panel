<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI User Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --bg-top:#eef7fb;
    --bg-bottom:#f5f0ff;
    --panel:#ffffffd9;
    --panel-solid:#ffffff;
    --ink:#1f2937;
    --muted:#5b6474;
    --brand:#2563eb;
    --brand-strong:#1d4ed8;
    --accent:#0f9f8f;
    --danger:#dc2626;
    --danger-soft:#fee2e2;
    --user:#0369a1;
    --border:#d9e3f5;
    --shadow:0 20px 45px rgba(15, 23, 42, 0.12);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:"Plus Jakarta Sans", "Segoe UI", sans-serif;
    color:var(--ink);
    background:linear-gradient(145deg,var(--bg-top),var(--bg-bottom));
    padding:24px;
}

.app-shell{
    width:min(1180px, 100%);
    margin:0 auto;
    backdrop-filter:blur(8px);
    border:1px solid #ffffff90;
    background:var(--panel);
    border-radius:8px;
    box-shadow:var(--shadow);
    overflow:hidden;
    display:grid;
    grid-template-rows:auto auto 1fr auto;
    min-height:calc(100vh - 48px);
}

.topbar{
    padding:20px 24px;
    background:linear-gradient(120deg, #eef7fb, #f5f0ff);
    border-bottom:1px solid #ffffff80;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
}

.title-wrap h1{
    margin:0;
    font-family:"Space Grotesk", sans-serif;
    font-size:26px;
    letter-spacing:0.2px;
}

.title-wrap p{
    margin:6px 0 0;
    color:var(--muted);
    font-size:14px;
}

.status-pill{
    background:#ffffffb3;
    border:1px solid #ffffffc7;
    color:#155e75;
    padding:8px 12px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
}

.control-panel{
    display:grid;
    grid-template-columns:1.05fr 1fr;
    gap:18px;
    padding:18px 24px 16px;
    border-bottom:1px solid var(--border);
}

.card{
    background:var(--panel-solid);
    border:1px solid var(--border);
    border-radius:8px;
    padding:14px;
}

.card h2{
    margin:0 0 10px;
    font-family:"Space Grotesk", sans-serif;
    font-size:18px;
}

label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    letter-spacing:0.4px;
    text-transform:uppercase;
    margin-bottom:8px;
}

select{
    width:100%;
    border:1px solid var(--border);
    background:#f8fafc;
    padding:12px 10px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    outline:none;
}

#agentDescription{
    margin:10px 0 0;
    font-size:14px;
    color:var(--muted);
}

.badge-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
}

.badge{
    font-size:12px;
    padding:6px 10px;
    border-radius:8px;
    background:#e0f2fe;
    color:#0c4a6e;
    border:1px solid #bae6fd;
}

.badge.danger{
    background:var(--danger-soft);
    color:#991b1b;
    border-color:#fecaca;
}

.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.quick-btn{
    border:1px solid #93c5fd;
    background:linear-gradient(120deg,#eff6ff,#dbeafe);
    border-radius:8px;
    color:#1e3a8a;
    text-align:left;
    padding:12px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .2s ease;
    font-weight:600;
    line-height:1.3;
}

.quick-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 16px rgba(30, 64, 175, 0.18);
}

.quick-btn.danger{
    background:#fff1f2;
    border-color:#fecdd3;
    color:#991b1b;
}

#chat{
    padding:22px 24px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:14px;
}

.message{
    max-width:760px;
    padding:14px 16px;
    border-radius:8px;
    line-height:1.5;
    font-size:14px;
    border:1px solid var(--border);
    animation:slideIn .2s ease;
}

.user{
    margin-left:auto;
    background:var(--user);
    color:white;
    border-color:#0c4a6e;
}

.ai{
    background:#f8fbff;
}

.user-card{
    padding:10px;
    border-radius:8px;
    background:#f8fafc;
    margin-top:8px;
    border:1px solid #e2e8f0;
    font-size:13px;
}

.loading{
    font-style:italic;
    opacity:0.75;
}

footer{
    padding:14px 24px 18px;
    background:#ffffffb8;
    border-top:1px solid var(--border);
    display:flex;
    gap:10px;
}

input{
    flex:1;
    border:1px solid var(--border);
    background:#ffffff;
    padding:12px 14px;
    border-radius:8px;
    font-size:14px;
    outline:none;
}

button.send-btn{
    border:none;
    background:linear-gradient(135deg,var(--brand),var(--brand-strong));
    color:white;
    padding:0 20px;
    border-radius:8px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

button.send-btn:hover{
    filter:brightness(1.05);
}

pre{
    margin:0;
    white-space:pre-wrap;
    word-break:break-word;
}

.summary{
    font-size:14px;
    margin-bottom:8px;
}

.meta{
    margin-top:8px;
    font-size:12px;
    color:#64748b;
}

@keyframes slideIn{
    from{opacity:0; transform:translateY(5px);}
    to{opacity:1; transform:translateY(0);}
}

@media (max-width: 920px){
    body{
        padding:12px;
    }

    .app-shell{
        min-height:calc(100vh - 24px);
    }

    .control-panel{
        grid-template-columns:1fr;
    }

    .quick-grid{
        grid-template-columns:1fr;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>
</head>
<body>

<main class="app-shell">
    <header class="topbar">
        <div class="title-wrap">
            <h1>AI User Admin Panel</h1>
            <p>Switch agents, run restricted tools, and manage users safely.</p>
        </div>
        <div class="status-pill">Multi-Agent Mode</div>
    </header>

    <section class="control-panel">
        <div class="card">
            <h2>Agent Control</h2>
            <label for="agentSelect">Choose Agent</label>
            <select id="agentSelect"></select>
            <p id="agentDescription"></p>
            <div id="toolBadges" class="badge-row"></div>
        </div>

        <div class="card">
            <h2>Quick Actions</h2>
            <div id="quickActions" class="quick-grid"></div>
        </div>
    </section>

    <section id="chat"></section>

    <footer>
        <input id="prompt" placeholder="Type a command for the selected agent..." />
        <button class="send-btn" onclick="sendPrompt()">Send</button>
    </footer>
</main>

<script>
const chat = document.getElementById("chat")
const input = document.getElementById("prompt")
const agentSelect = document.getElementById("agentSelect")
const agentDescription = document.getElementById("agentDescription")
const toolBadges = document.getElementById("toolBadges")
const quickActions = document.getElementById("quickActions")

let agentConfigs = {}

const QUICK_ACTIONS = {
    agent1: [
        { label: "Create Demo User", prompt: "create a user named Asha with email asha.demo@example.com" },
        { label: "Count Users", prompt: "how many users are there" },
        { label: "Create Support User", prompt: "create a user named Kiran with email kiran.support@example.com" },
        { label: "Check Total Users", prompt: "give me the total user count" }
    ],
    agent2: [
        { label: "Show All Users", prompt: "show all users" },
        { label: "Find by Email", prompt: "find user by email asha.demo@example.com" },
        { label: "Find by Name", prompt: "find user by name Asha" },
        { label: "Lookup Kiran", prompt: "find user by email kiran.support@example.com" },
        { label: "List Current Users", prompt: "get users list" }
    ],
    agent3: [
        { label: "Latest User", prompt: "show latest user" },
        { label: "Update Asha Email", prompt: "update user Asha email to asha.updated@example.com using target_name Asha" },
        { label: "Delete Asha", prompt: "delete user named Asha", danger: true },
        { label: "Update Kiran Name", prompt: "update user Kiran name to Kiran Raj using target_name Kiran" },
        { label: "Review Latest Profile", prompt: "fetch latest user details" }
    ]
}

input.addEventListener("keypress", function(e){
    if(e.key === "Enter") sendPrompt()
})

function escapeHtml(str){
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;")
}

function addMessage(content, type, isHtml = false){
    const div = document.createElement("div")
    div.className = "message " + type
    div.innerHTML = isHtml ? content : escapeHtml(content)
    chat.appendChild(div)
    chat.scrollTop = chat.scrollHeight
}

function formatResult(result){
    if(result === null || result === undefined){
        return "No result"
    }
    if(typeof result === "string"){
        return escapeHtml(result)
    }
    if(Array.isArray(result)){
        if(result.length === 0) return "No users found"
        return result.map((item) => {
            if(item && item.id && item.name && item.email){
                return `
                <div class="user-card">
                    <b>User ID:</b> ${escapeHtml(item.id)}<br>
                    <b>Name:</b> ${escapeHtml(item.name)}<br>
                    <b>Email:</b> ${escapeHtml(item.email)}
                </div>`
            }
            return `<pre>${escapeHtml(JSON.stringify(item, null, 2))}</pre>`
        }).join("")
    }
    if(result.id && result.name && result.email){
        return `
        <div class="user-card">
            <b>User ID:</b> ${escapeHtml(result.id)}<br>
            <b>Name:</b> ${escapeHtml(result.name)}<br>
            <b>Email:</b> ${escapeHtml(result.email)}
        </div>`
    }
    return `<pre>${escapeHtml(JSON.stringify(result, null, 2))}</pre>`
}

function userCard(user){
    return `
    <div class="user-card">
        <b>User ID:</b> ${escapeHtml(user.id)}<br>
        <b>Name:</b> ${escapeHtml(user.name)}<br>
        <b>Email:</b> ${escapeHtml(user.email)}
    </div>`
}

function summarizeToolResult(tool, result){
    if(result && result.error){
        return {
            summary: `I could not complete this action: ${escapeHtml(result.error)}`,
            details: ""
        }
    }

    if(tool === "mcp1/create_user_tool" && result && result.id){
        return {
            summary: `User created successfully: ${escapeHtml(result.name)} (${escapeHtml(result.email)}).`,
            details: userCard(result)
        }
    }

    if(tool === "mcp1/get_users_tool" && Array.isArray(result)){
        if(result.length === 0){
            return { summary: "No users are available right now.", details: "" }
        }
        const names = result.map((u) => u.name).filter(Boolean).join(", ")
        return {
            summary: `Found ${result.length} user(s): ${escapeHtml(names)}.`,
            details: result.filter((u) => u.id && u.name && u.email).map((u) => userCard(u)).join("")
        }
    }

    if(tool === "mcp1/update_user_tool" && result && result.id){
        return {
            summary: `User updated successfully for ${escapeHtml(result.name)}.`,
            details: userCard(result)
        }
    }

    if(tool === "mcp1/delete_user_tool" && result && result.id){
        return {
            summary: `User deleted successfully: ${escapeHtml(result.name)}.`,
            details: userCard(result)
        }
    }

    if(tool === "mcp2/get_user_count_tool" && result && typeof result.count === "number"){
        return {
            summary: `Current total users: ${result.count}.`,
            details: ""
        }
    }

    if(tool === "mcp2/find_user_by_email_tool"){
        if(result && result.id){
            return {
                summary: `Found the user for that email: ${escapeHtml(result.name)}.`,
                details: userCard(result)
            }
        }
        return {
            summary: "No user was found for that email.",
            details: ""
        }
    }

    if(tool === "mcp2/find_user_by_name_tool"){
        if(result && result.id){
            return {
                summary: `Found user by name: ${escapeHtml(result.name)}.`,
                details: userCard(result)
            }
        }
        return {
            summary: "No user was found for that name.",
            details: ""
        }
    }

    if(tool === "mcp2/get_latest_user_tool"){
        if(result && result.id){
            return {
                summary: `Latest user is ${escapeHtml(result.name)}.`,
                details: userCard(result)
            }
        }
        return {
            summary: "No latest user is available yet.",
            details: ""
        }
    }

    return {
        summary: "Action completed.",
        details: formatResult(result)
    }
}

function parseAIResponse(data){
    if(data.error){
        return `<b>Error:</b> ${escapeHtml(data.error)}`
    }
    if(data.agent){
        const agent = escapeHtml(data.agent)
        const tool = data.tool || "-"
        const readableTool = escapeHtml(tool.replace("/", " -> "))
        const view = summarizeToolResult(tool, data.result)
        return `
        <div class="summary">${view.summary}</div>
        ${view.details}
        <div class="meta">Handled by ${agent} using ${readableTool}</div>
        `
    }
    if(data.result){
        return `<div class="summary">Action completed.</div>${formatResult(data.result)}`
    }
    return `<div class="summary">Received response from server.</div>`
}

function renderAgentInfo(agentName){
    const cfg = agentConfigs[agentName]
    if(!cfg){
        agentDescription.textContent = "No configuration found."
        toolBadges.innerHTML = ""
        quickActions.innerHTML = ""
        return
    }

    agentDescription.textContent = cfg.description || ""
    const tools = cfg.allowed_tools || []
    toolBadges.innerHTML = tools.map((tool) => {
        const className = tool.includes("delete") ? "badge danger" : "badge"
        return `<span class="${className}">${escapeHtml(tool)}</span>`
    }).join("")

    const actions = QUICK_ACTIONS[agentName] || []
    quickActions.innerHTML = actions.map((action) => {
        const prompt = escapeHtml(action.prompt)
        const label = escapeHtml(action.label)
        const className = action.danger ? "quick-btn danger" : "quick-btn"
        return `<button class="${className}" data-prompt="${prompt}">${label}</button>`
    }).join("")

    quickActions.querySelectorAll(".quick-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
            const prompt = btn.getAttribute("data-prompt") || ""
            input.value = prompt
            sendPrompt()
        })
    })
}

async function loadAgents(){
    try{
        const res = await fetch("http://127.0.0.1:8000/agents")
        const data = await res.json()
        agentConfigs = data || {}

        const names = Object.keys(agentConfigs)
        if(names.length === 0){
            agentSelect.innerHTML = `<option value="">No agents</option>`
            addMessage("No agents found from backend. Check /agents endpoint.", "ai")
            return
        }

        agentSelect.innerHTML = names
            .map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`)
            .join("")

        renderAgentInfo(names[0])
        addMessage(`Connected. Selected ${names[0]}. Try a quick action from the panel.`, "ai")
    }catch(err){
        agentSelect.innerHTML = `<option value="">Unavailable</option>`
        addMessage("Could not load agents. Verify backend is running on port 8000.", "ai")
    }
}

agentSelect.addEventListener("change", () => {
    const selected = agentSelect.value
    renderAgentInfo(selected)
    addMessage(`Switched to ${selected}.`, "ai")
})

async function sendPrompt(){
    const prompt = input.value.trim()
    if(!prompt) return

    const agent = agentSelect.value
    if(!agent){
        addMessage("Please select an agent first.", "ai")
        return
    }

    addMessage(`[${agent}] ${prompt}`, "user")
    input.value = ""

    const loading = document.createElement("div")
    loading.className = "message ai loading"
    loading.innerText = "Thinking..."
    chat.appendChild(loading)

    try{
        const res = await fetch(
            `http://127.0.0.1:8000/agents/${encodeURIComponent(agent)}/chat?prompt=${encodeURIComponent(prompt)}`,
            { method:"POST" }
        )
        const data = await res.json()
        loading.remove()
        addMessage(parseAIResponse(data), "ai", true)
    }catch(err){
        loading.remove()
        addMessage("Server connection failed.", "ai")
    }
}

loadAgents()
</script>

</body>
</html>
